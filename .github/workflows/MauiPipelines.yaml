name: .NET MAUI CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-android:
    name: Build Android AAB
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Workload
        run: dotnet workload install maui --skip-manifest-update

      - name: Restore Dependencies
        run: dotnet restore ./FeedOptimizationApp.sln --verbosity detailed

      - name: Build Android App
        run: dotnet build ./FeedOptimizationApp.sln -f net9.0-android -c Release

      - name: Clean publish folder
        run: |
          if (Test-Path ./publish) {
              Remove-Item -Recurse -Force ./publish
          }
          New-Item -ItemType Directory -Path ./publish | Out-Null

      - name: Create Android AAB
        run: |
          dotnet publish ./FeedOptimizationApp.sln -f net9.0-android -c Release -p:AndroidPackageFormat=aab -o ./publish
          $aab = Get-ChildItem ./publish -Filter *.aab | Select-Object -First 1
          if ($aab) {
              Move-Item $aab.FullName ./publish/App.aab -Force
          } else {
              Write-Error "No AAB files found in publish directory"
              exit 1
          }
        shell: pwsh

      - name: Upload Android Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-AAB
          path: ./publish/App.aab

  deploy-android:
    name: Deploy to Google Play
    runs-on: windows-latest
    needs: build-android

    steps:
      - name: Download Android AAB
        uses: actions/download-artifact@v3
        with:
          name: Android-AAB
          path: ./publish

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

      - name: Deploy to Google Play Store (Beta)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ secrets.GCP_CREDENTIALS }}
          packageName: "com.icarda.feedapp"
          releaseFiles: "./publish/App.aab"
          track: beta
          status: completed

  notify-team:
    name: Notify Team
    runs-on: windows-latest
    needs: [deploy-android]

    steps:
      - name: Send Teams Notification
        shell: pwsh
        run: |
          $webhookUrl = "${{ secrets.TEAMS_WEBHOOK_URL }}"
          $body = @{
              text = "🚀 New MAUI App Bundle (.aab) deployed to Google Play! 🎉"
          } | ConvertTo-Json -Compress
          
          Invoke-RestMethod -Uri $webhookUrl -Method Post -Body $body -ContentType 'application/json'

