name: .NET MAUI CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android AAB
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Workload
        shell: pwsh
        run: dotnet workload install maui --skip-manifest-update

      - name: Restore Dependencies
        shell: pwsh
        run: dotnet restore FeedOptimizationApp/FeedOptimizationApp.sln --verbosity detailed

      - name: Build Android App
        shell: pwsh
        run: dotnet build FeedOptimizationApp/FeedOptimizationApp.sln -f net9.0-android -c Release

      - name: Clean publish folder
        shell: pwsh
        run: |
          $publishDir = Join-Path "${{ github.workspace }}" 'publish'
          if (Test-Path $publishDir) { Remove-Item -Recurse -Force $publishDir }
          New-Item -ItemType Directory -Path $publishDir | Out-Null

      - name: Create Android AAB
        shell: pwsh
        run: |
          $publishDir = Join-Path "${{ github.workspace }}" 'publish'
          $versionCode = $env:GITHUB_RUN_NUMBER
          $versionName = (Get-Date -Format "yyyy.MM.dd.HHmm")

          dotnet publish FeedOptimizationApp/FeedOptimizationApp.sln `
            -f net9.0-android `
            -c Release `
            -p:AndroidPackageFormat=aab `
            -p:ApplicationVersion=$versionCode `
            -p:ApplicationDisplayVersion=$versionName `
            -o $publishDir

          $aab = Get-ChildItem (Join-Path $publishDir '*.aab') | Select-Object -First 1
          if ($aab) {
              Move-Item $aab.FullName (Join-Path $publishDir 'App.aab')
              Write-Host "AAB file created: $(Join-Path $publishDir 'App.aab')"
              Write-Host "File size: $((Get-Item (Join-Path $publishDir 'App.aab')).Length) bytes"
          } else {
              Write-Error "No AAB files found in publish directory"
              exit 1
          }

      - name: Debug - List publish directory
        shell: pwsh
        run: Get-ChildItem -Recurse "${{ github.workspace }}\publish"

      - name: Upload Android Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-AAB
          path: ${{ github.workspace }}\publish\App.aab
          overwrite: true

  deploy-android:
    name: Deploy to Google Play
    runs-on: windows-latest
    needs: build-android

    steps:
      - name: Download Android AAB
        uses: actions/download-artifact@v4
        with:
          name: Android-AAB
          path: ${{ github.workspace }}\artifacts

      - name: Debug - List downloaded files
        shell: pwsh
        run: |
          Write-Host "=== Artifacts directory structure ==="
          Get-ChildItem -Recurse "${{ github.workspace }}\artifacts" | Select-Object FullName

          Write-Host "=== Looking for AAB files ==="
          $aabFiles = Get-ChildItem -Recurse "${{ github.workspace }}\artifacts" -Filter "*.aab"
          if ($aabFiles) {
            $aabFiles | ForEach-Object { Write-Host "Found: $($_.FullName)" }
          } else {
            Write-Host "No AAB files found in artifacts directory."
          }

      #  FIXED: Prepare files in working directory with relative paths
      - name: Prepare files for upload
        shell: pwsh
        run: |
          # Create publish directory in working directory (not full path)
          $publishDir = "publish"
          if (!(Test-Path $publishDir)) { New-Item -ItemType Directory -Path $publishDir | Out-Null }
          
          # Find and copy AAB file to working directory
          $aabFile = Get-ChildItem -Recurse "${{ github.workspace }}\artifacts" -Filter "*.aab" | Select-Object -First 1
          if ($aabFile) {
            Copy-Item -Path $aabFile.FullName -Destination "publish\App.aab" -Force
            Write-Host " AAB file copied to working directory: publish\App.aab"
            Write-Host "File size: $((Get-Item 'publish\App.aab').Length) bytes"
          } else {
            Write-Error " No AAB file found in artifacts"
            exit 1
          }

      #  FIXED: Write and validate Service Account JSON
      - name: Write and Validate Service Account JSON
        shell: pwsh
        run: |
          Write-Host "=== Creating Service Account JSON ==="
          
          # Write the JSON file
          echo '${{ secrets.GCP_CREDENTIALS }}' > "service_account.json"
          
          Write-Host "Service Account JSON file created"
          Write-Host "File size: $((Get-Item 'service_account.json').Length) bytes"
          
          # Validate JSON format
          try {
            $jsonContent = Get-Content 'service_account.json' -Raw
            $parsed = $jsonContent | ConvertFrom-Json
            Write-Host " Service Account JSON is valid"
            Write-Host "Project ID: $($parsed.project_id)"
            Write-Host "Client Email: $($parsed.client_email)"
            Write-Host "Type: $($parsed.type)"
          } catch {
            Write-Error " Invalid Service Account JSON format: $($_.Exception.Message)"
            Write-Host "First 200 characters of the JSON file:"
            $content = Get-Content 'service_account.json' -Raw
            Write-Host $content.Substring(0, [Math]::Min(200, $content.Length))
            Write-Host "..."
            Write-Host "Please check your GCP_CREDENTIALS secret in GitHub repository settings."
            exit 1
          }

      #  FIXED: Final verification with working directory paths
      - name: Verify files before upload
        shell: pwsh
        run: |
          Write-Host "=== Final verification ==="
          Write-Host "Working directory: $(Get-Location)"
          Write-Host "Working directory contents:"
          Get-ChildItem "." | Format-Table -AutoSize
          
          Write-Host "Checking required files:"
          $serviceAccountExists = Test-Path 'service_account.json'
          $aabExists = Test-Path 'publish\App.aab'
          
          Write-Host "✓ Service Account JSON exists: $serviceAccountExists"
          Write-Host "✓ AAB file exists: $aabExists"
          
          if ($aabExists) {
            Write-Host "✓ AAB file size: $((Get-Item 'publish\App.aab').Length) bytes"
          }
          
          if (-not $serviceAccountExists -or -not $aabExists) {
            Write-Error " Required files are missing!"
            exit 1
          }
          
          Write-Host " All files are ready for upload"

      #  FIXED: Deploy with relative paths and updated action version
      - name: Deploy to Google Play Store (Beta)
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJson: service_account.json    # Relative path
          packageName: com.icarda.feedapp
          releaseFiles: publish/App.aab              # Relative path with forward slash
          track: beta
          status: completed

  notify-team:
    name: Notify Team
    runs-on: windows-latest
    needs: [deploy-android]

    steps:
      - name: Send Teams Notification
        shell: pwsh
        run: |
          $webhookUrl = "${{ secrets.TEAMS_WEBHOOK_URL }}"
          $body = @{
              text = "🚀 New MAUI App Bundle (.aab) deployed to Google Play! 🎉"
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri $webhookUrl -Method Post -Body $body -ContentType 'application/json'