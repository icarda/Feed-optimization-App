name: .NET MAUI CI/CD Pipeline #trigger service

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android AAB
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Workload
        shell: pwsh
        run: dotnet workload install maui --skip-manifest-update

      - name: Restore Dependencies
        shell: pwsh
        run: dotnet restore FeedOptimizationApp/FeedOptimizationApp.sln --verbosity detailed

      #  ADDED: Recreate keystore file from GitHub secret (used for app signing)
      - name: Create keystore file from secret
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE }}")
          $ks = Join-Path $env:RUNNER_TEMP 'upload-keystore.jks'
          [IO.File]::WriteAllBytes($ks, $bytes)
          Write-Host "✅ Keystore written to: $ks"

      #  ADDED (optional): Display alias & SHA1 from keystore for verification
      - name: Verify keystore SHA1 (sanity)
        shell: pwsh
        run: |
          $ks = Join-Path $env:RUNNER_TEMP 'upload-keystore.jks'
          & "$env:JAVA_HOME\bin\keytool.exe" -list -v -keystore $ks `
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" `
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" |
            Select-String "Alias name|SHA1"

      - name: Build Android App
        shell: pwsh
        run: dotnet build FeedOptimizationApp/FeedOptimizationApp.sln -f net9.0-android -c Release

      - name: Clean publish folder
        shell: pwsh
        run: |
          $publishDir = Join-Path "${{ github.workspace }}" 'publish'
          if (Test-Path $publishDir) { Remove-Item -Recurse -Force $publishDir }
          New-Item -ItemType Directory -Path $publishDir | Out-Null

      # UPDATED: Replaced line-continuation syntax with PowerShell splatting (fixes -p: error)
      - name: Create Android AAB
        shell: pwsh
        run: |
          $publishDir = Join-Path "${{ github.workspace }}" 'publish'
          $versionCode = 10000 + [int]$env:GITHUB_RUN_NUMBER
          $versionName = (Get-Date -Format "yyyy.MM.dd.HHmm")
          $ks = Join-Path $env:RUNNER_TEMP 'upload-keystore.jks'

          # Define signing properties safely in PowerShell array
          $props = @(
            '-p:AndroidPackageFormat=aab'
            "-p:ApplicationVersion=$versionCode"
            "-p:ApplicationDisplayVersion=$versionName"
            "-p:AndroidSigningKeyStore=$ks"
            "-p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            "-p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            "-p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}"
          )

          #  Pass properties into dotnet publish using splatting (@props)
          dotnet publish "FeedOptimizationApp/FeedOptimizationApp.sln" `
            -f net9.0-android -c Release @props -o $publishDir

          # Move the resulting .aab file into publish folder
          $aab = Get-ChildItem (Join-Path $publishDir '*.aab') | Select-Object -First 1
          if ($aab) {
            Move-Item $aab.FullName (Join-Path $publishDir 'App.aab') -Force
            Write-Host "✅ AAB file created: $(Join-Path $publishDir 'App.aab')"
            Write-Host "File size: $((Get-Item (Join-Path $publishDir 'App.aab')).Length) bytes"
          } else {
            Write-Error "❌ No AAB files found in publish directory"
            exit 1
          }

      # ADDED (optional): Print certificate SHA1 to confirm signing
      - name: Print AAB signing certificate (SHA1)
        shell: pwsh
        run: |
          $aab = Join-Path "${{ github.workspace }}" 'publish\App.aab'
          & "$env:JAVA_HOME\bin\keytool.exe" -printcert -jarfile $aab | Select-String "SHA1"

      - name: Debug - List publish directory
        shell: pwsh
        run: Get-ChildItem -Recurse "${{ github.workspace }}\publish"

      - name: Upload Android Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-AAB
          path: ${{ github.workspace }}\publish\App.aab
          overwrite: true

  deploy-android:
    name: Deploy to Google Play (Beta Track)
    runs-on: windows-latest
    needs: build-android

    steps:
      - name: Download Android AAB
        uses: actions/download-artifact@v4
        with:
          name: Android-AAB
          path: ${{ github.workspace }}\artifacts

      - name: Prepare files for upload
        shell: pwsh
        run: |
          $publishDir = "publish"
          if (!(Test-Path $publishDir)) { New-Item -ItemType Directory -Path $publishDir | Out-Null }
          $aabFile = Get-ChildItem -Recurse "${{ github.workspace }}\artifacts" -Filter "*.aab" | Select-Object -First 1
          if ($aabFile) {
            Copy-Item -Path $aabFile.FullName -Destination "publish\App.aab" -Force
            Write-Host "✅ AAB file copied to working directory: publish\App.aab"
            Write-Host "File size: $((Get-Item 'publish\App.aab').Length) bytes"
          } else {
            Write-Error "❌ No AAB file found in artifacts"
            exit 1
          }

      - name: Write and Validate Service Account JSON
        shell: pwsh
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' > "service_account.json"
          Write-Host "✅ Service Account JSON file created"
          try {
            $parsed = (Get-Content 'service_account.json' -Raw) | ConvertFrom-Json
            Write-Host "Project ID: $($parsed.project_id)"
          } catch {
            Write-Error "❌ Invalid JSON format"
            exit 1
          }

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          project_id: feed-optimisation-app

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable Google Play Android Developer API
        shell: pwsh
        run: gcloud services enable androidpublisher.googleapis.com --quiet || $true

      - name: Verify files before upload
        shell: pwsh
        run: |
          Write-Host "=== Final verification ==="
          Write-Host "Service Account JSON: $(Test-Path 'service_account.json')"
          Write-Host "AAB file: $(Test-Path 'publish\App.aab')"

      - name: Deploy to Google Play Store (Beta Track)
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJson: service_account.json
          packageName: com.icarda.feedapp
          releaseFiles: publish/App.aab
          track: beta
          status: completed
          releaseName: "CI Build #${{ github.run_number }}"

  #  Teams notification job 
  notify-team:
    name: Notify Team
    runs-on: windows-latest
    needs: [deploy-android]

    steps:
      - name: Send Teams Notification
        shell: pwsh
        run: |
          $webhookUrl = "${{ secrets.TEAMS_WEBHOOK_URL }}"
          $body = @{
            text = "🚀 New MAUI App (.aab) deployed to Google Play **Beta Track**! 🎉`n`n📱 **Feed Optimization App**`n🏷️ **Build #${{ github.run_number }}**`n🔗 **Commit:** ${{ github.sha }}`n🧵 **Branch:** ${{ github.ref_name }}`n📅 **Deployed:** $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')`n`n✅ Ready for beta testing team review!"
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri $webhookUrl -Method Post -Body $body -ContentType 'application/json'
