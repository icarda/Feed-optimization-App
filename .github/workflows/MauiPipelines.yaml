name: .NET MAUI CI/CD Pipeline #trigger service

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android AAB
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Workload
        shell: pwsh
        run: dotnet workload install maui --skip-manifest-update

      - name: Restore Dependencies
        shell: pwsh
        run: dotnet restore FeedOptimizationApp/FeedOptimizationApp.sln --verbosity detailed

      # ✨ ADDED: Recreate keystore file from secret
      - name: Create keystore file from secret
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE }}")
          $ks = Join-Path $env:RUNNER_TEMP 'upload-keystore.jks'
          [IO.File]::WriteAllBytes($ks, $bytes)
          Write-Host "Keystore written to: $ks"

      # ✨ ADDED (optional): Verify the keystore/alias SHA1 matches Play's Upload key
      - name: Verify keystore SHA1 (sanity)
        shell: pwsh
        run: |
          $ks = Join-Path $env:RUNNER_TEMP 'upload-keystore.jks'
          & "$env:JAVA_HOME\bin\keytool.exe" -list -v -keystore $ks `
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" `
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" |
            Select-String "Alias name|SHA1"

      - name: Build Android App
        shell: pwsh
        run: dotnet build FeedOptimizationApp/FeedOptimizationApp.sln -f net9.0-android -c Release

      - name: Clean publish folder
        shell: pwsh
        run: |
          $publishDir = Join-Path "${{ github.workspace }}" 'publish'
          if (Test-Path $publishDir) { Remove-Item -Recurse -Force $publishDir }
          New-Item -ItemType Directory -Path $publishDir | Out-Null

      - name: Create Android AAB
        shell: pwsh
        run: |
          $publishDir = Join-Path "${{ github.workspace }}" 'publish'
          # (optional) bump to avoid versionCode collisions with manual uploads
          $versionCode = 10000 + [int]$env:GITHUB_RUN_NUMBER   # ✨ ADDED (change/remove if you prefer)
          $versionName = (Get-Date -Format "yyyy.MM.dd.HHmm")
          $ks = Join-Path $env:RUNNER_TEMP 'upload-keystore.jks'  # ✨ ADDED

          dotnet publish FeedOptimizationApp/FeedOptimizationApp.sln `
            -f net9.0-android `
            -c Release `
            -p:AndroidPackageFormat=aab `
            -p:ApplicationVersion=$versionCode `
            -p:ApplicationDisplayVersion=$versionName `
            -p:AndroidSigningKeyStore="$ks" `                              # ✨ ADDED
            -p:AndroidSigningStorePass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" `   # ✨ ADDED
            -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" `            # ✨ ADDED
            -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}" `    # ✨ ADDED
            -o $publishDir

          $aab = Get-ChildItem (Join-Path $publishDir '*.aab') | Select-Object -First 1
          if ($aab) {
              Move-Item $aab.FullName (Join-Path $publishDir 'App.aab')
              Write-Host "AAB file created: $(Join-Path $publishDir 'App.aab')"
              Write-Host "File size: $((Get-Item (Join-Path $publishDir 'App.aab')).Length) bytes)"
          } else {
              Write-Error "No AAB files found in publish directory"
              exit 1
          }

      # ✨ ADDED (optional): Prove the produced AAB is signed with the expected key
      - name: Print AAB signing certificate (SHA1)
        shell: pwsh
        run: |
          $aab = Join-Path "${{ github.workspace }}" 'publish\App.aab'
          & "$env:JAVA_HOME\bin\keytool.exe" -printcert -jarfile $aab | Select-String "SHA1"

      - name: Debug - List publish directory
        shell: pwsh
        run: Get-ChildItem -Recurse "${{ github.workspace }}\publish"

      - name: Upload Android Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-AAB
          path: ${{ github.workspace }}\publish\App.aab
          overwrite: true

  deploy-android:
    name: Deploy to Google Play (Beta Track)
    runs-on: windows-latest
    needs: build-android

    steps:
      - name: Download Android AAB
        uses: actions/download-artifact@v4
        with:
          name: Android-AAB
          path: ${{ github.workspace }}\artifacts

      - name: Debug - List downloaded files
        shell: pwsh
        run: |
          Write-Host "=== Artifacts directory structure ==="
          Get-ChildItem -Recurse "${{ github.workspace }}\artifacts" | Select-Object FullName

          Write-Host "=== Looking for AAB files ==="
          $aabFiles = Get-ChildItem -Recurse "${{ github.workspace }}\artifacts" -Filter "*.aab"
          if ($aabFiles) {
            $aabFiles | ForEach-Object { Write-Host "Found: $($_.FullName)" }
          } else {
            Write-Host "No AAB files found in artifacts directory."
          }

      - name: Prepare files for upload
        shell: pwsh
        run: |
          $publishDir = "publish"
          if (!(Test-Path $publishDir)) { New-Item -ItemType Directory -Path $publishDir | Out-Null }
          $aabFile = Get-ChildItem -Recurse "${{ github.workspace }}\artifacts" -Filter "*.aab" | Select-Object -First 1
          if ($aabFile) {
            Copy-Item -Path $aabFile.FullName -Destination "publish\App.aab" -Force
            Write-Host "✅ AAB file copied to working directory: publish\App.aab"
            Write-Host "File size: $((Get-Item 'publish\App.aab').Length) bytes"
          } else {
            Write-Error "❌ No AAB file found in artifacts"
            exit 1
          }

      - name: Write and Validate Service Account JSON
        shell: pwsh
        run: |
          Write-Host "=== Creating Service Account JSON ==="
          echo '${{ secrets.GCP_CREDENTIALS }}' > "service_account.json"
          Write-Host "Service Account JSON file created"
          Write-Host "File size: $((Get-Item 'service_account.json').Length) bytes"
          try {
            $jsonContent = Get-Content 'service_account.json' -Raw
            $parsed = $jsonContent | ConvertFrom-Json
            Write-Host "✅ Service Account JSON is valid"
            Write-Host "Project ID: $($parsed.project_id)"
            Write-Host "Client Email: $($parsed.client_email)"
            Write-Host "Type: $($parsed.type)"
          } catch {
            Write-Error "❌ Invalid Service Account JSON format: $($_.Exception.Message)"
            exit 1
          }

      # (Optional) These aren't required by the upload action, but harmless if you keep them.
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          project_id: feed-optimisation-app

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable Google Play Android Developer API
        shell: pwsh
        run: |
          gcloud services enable androidpublisher.googleapis.com --quiet || $true

      - name: Verify files before upload
        shell: pwsh
        run: |
          Write-Host "=== Final verification for Beta Track deployment ==="
          Write-Host "Working directory: $(Get-Location)"
          Write-Host "Checking required files:"
          Write-Host "✓ Service Account JSON exists: $(Test-Path 'service_account.json')"
          Write-Host "✓ AAB file exists: $(Test-Path 'publish\App.aab')"

      - name: Deploy to Google Play Store (Beta Track)
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJson: service_account.json
          packageName: com.icarda.feedapp
          releaseFiles: publish/App.aab
          track: beta
          status: completed
          releaseName: "CI Build #${{ github.run_number }}"
          # NOTE: 'releaseNotes' is not a supported input for this action version.

  notify-team:
    name: Notify Team
    runs-on: windows-latest
    needs: [deploy-android]

    steps:
      - name: Send Teams Notification
        shell: pwsh
        run: |
          $webhookUrl = "${{ secrets.TEAMS_WEBHOOK_URL }}"
          $body = @{
              text = "🚀 New MAUI App Bundle (.aab) deployed to Google Play Beta Track! 🎉`n`n📱 **Feed Optimization App**`n🏷️ **Build #${{ github.run_number }}**`n🔗 **Commit:** ${{ github.sha }}`n📅 **Deployed:** $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')`n`n✅ Ready for beta testing team review!"
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri $webhookUrl -Method Post -Body $body -ContentType 'application/json'
