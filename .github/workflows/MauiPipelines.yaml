name: .NET MAUI CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android AAB
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Workload
        shell: pwsh
        run: dotnet workload install maui --skip-manifest-update

      - name: Restore Dependencies
        shell: pwsh
        run: dotnet restore FeedOptimizationApp/FeedOptimizationApp.sln --verbosity detailed

      # 🔐 Decode keystore file from GitHub secret
      - name: Decode Keystore
        shell: pwsh
        run: |
          $bytes = [System.Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")
          [System.IO.File]::WriteAllBytes("keystore.jks", $bytes)

      - name: Build and Sign Android AAB
        shell: pwsh
        run: |
          $publishDir = Join-Path "${{ github.workspace }}" 'publish'
          if (Test-Path $publishDir) { Remove-Item -Recurse -Force $publishDir }
          New-Item -ItemType Directory -Path $publishDir | Out-Null

          $versionCode = $env:GITHUB_RUN_NUMBER
          $versionName = (Get-Date -Format "yyyy.MM.dd.HHmm")

          dotnet publish FeedOptimizationApp/FeedOptimizationApp.sln `
            -f net9.0-android `
            -c Release `
            -p:AndroidPackageFormat=aab `
            -p:ApplicationVersion=$versionCode `
            -p:ApplicationDisplayVersion=$versionName `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore=keystore.jks `
            -p:AndroidSigningKeyAlias='${{ secrets.ANDROID_KEY_ALIAS }}' `
            -p:AndroidSigningKeyPass='${{ secrets.ANDROID_KEY_PASSWORD }}' `
            -p:AndroidSigningStorePass='${{ secrets.ANDROID_STORE_PASSWORD }}' `
            -o $publishDir

          $aab = Get-ChildItem (Join-Path $publishDir '*.aab') | Select-Object -First 1
          if ($aab) {
              Move-Item $aab.FullName (Join-Path $publishDir 'App.aab')
          } else {
              Write-Error "No AAB files found in publish directory"
              exit 1
          }

      - name: Upload Android Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-AAB
          path: ${{ github.workspace }}/publish/App.aab
          overwrite: true

  deploy-android:
    name: Deploy to Google Play
    runs-on: windows-latest
    needs: build-android

    steps:
      - name: Download Android AAB
        uses: actions/download-artifact@v4
        with:
          pattern: Android-AAB
          path: ${{ github.workspace }}/publish
          merge-multiple: true

      - name: Write Service Account JSON
        shell: pwsh
        run: echo "${{ secrets.GCP_CREDENTIALS }}" > ${{ github.workspace }}/service_account.json

      - name: Deploy to Google Play Store (Beta)
        uses: r0adkll/upload-google-play@v1.1.2
        with:
          serviceAccountJson: ${{ github.workspace }}/service_account.json
          packageName: com.icarda.feedapp
          releaseFiles: ${{ github.workspace }}/publish/App.aab
          track: beta
          status: completed

  notify-team:
    name: Notify Team
    runs-on: windows-latest
    needs: [deploy-android]

    steps:
      - name: Send Teams Notification
        shell: pwsh
        run: |
          $webhookUrl = "${{ secrets.TEAMS_WEBHOOK_URL }}"
          $body = @{
              text = "🚀 New MAUI App Bundle (.aab) deployed to Google Play! 🎉"
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri $webhookUrl -Method Post -Body $body -ContentType 'application/json'